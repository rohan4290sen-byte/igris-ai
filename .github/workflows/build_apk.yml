name: Build IGRIS APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Auto-fix Manifest and Accept Licenses
      run: |
        sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' igris_app/app/src/main/AndroidManifest.xml || true
        sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' igris_app/app/src/main/AndroidManifest.xml || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      working-directory: ./igris_app

    - name: Upload Igris APK
      uses: actions/upload-artifact@v4
      with:
        name: Igris-AI-App
        path: igris_app/app/build/outputs/apk/debug/*.apk
