name: Build IGRIS APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Auto-Configure Gradle & Fix Project
      run: |
        cat << 'EOF' > igris_app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > igris_app/app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.igris.ai'
            compileSdk 34

            defaultConfig {
                applicationId "com.igris.ai"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.google.code.gson:gson:2.10.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

        sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' igris_app/app/src/main/AndroidManifest.xml || true
        sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' igris_app/app/src/main/AndroidManifest.xml || true

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      working-directory: ./igris_app

    - name: Upload Igris APK
      uses: actions/upload-artifact@v4
      with:
        name: Igris-AI-App
        path: igris_app/app/build/outputs/apk/debug/*.apk
