name: Build IGRIS APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Fix All Project Files
      run: |
        cat > igris_app/build.gradle << 'ENDOFFILE'
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        ENDOFFILE

        cat > igris_app/app/build.gradle << 'ENDOFFILE'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.igris.ai'
            compileSdk 34
            defaultConfig {
                applicationId "com.igris.ai"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.google.code.gson:gson:2.10.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        ENDOFFILE

        cat > igris_app/app/src/main/AndroidManifest.xml << 'ENDOFFILE'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools"
            package="com.igris.ai">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                tools:ignore="QueryAllPackagesPermission" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.Igris">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".FloatingFlameService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse">
                    <property
                        android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                        android:value="Floating AI Assistant Overlay" />
                </service>
            </application>
        </manifest>
        ENDOFFILE

        cat > igris_app/app/src/main/java/com/igris/ai/IgrisVoice.kt << 'ENDOFFILE'
        package com.igris.ai

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.speech.tts.TextToSpeech
        import java.util.Locale

        class IgrisVoice(
            private val context: Context,
            private val onSpeechResult: (String) -> Unit,
            private val onStatusChange: (String) -> Unit
        ) : TextToSpeech.OnInitListener {

            private var tts: TextToSpeech? = null
            private var speechRecognizer: SpeechRecognizer? = null
            private var isTtsReady = false

            init {
                tts = TextToSpeech(context, this)
                setupSpeechRecognizer()
            }

            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    // Try Hindi-English mix first, fallback to default
                    val result = tts?.setLanguage(Locale("hi", "IN"))
                    if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                        tts?.setLanguage(Locale.ENGLISH)
                    }
                    tts?.setPitch(0.72f)
                    tts?.setSpeechRate(0.95f)
                    isTtsReady = true
                    speak("Igris activated. At your command, Boss.")
                }
            }

            fun speak(text: String) {
                if (isTtsReady && tts != null) {
                    tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "IGRIS_SPEECH")
                }
            }

            private fun setupSpeechRecognizer() {
                if (SpeechRecognizer.isRecognitionAvailable(context)) {
                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(context)
                    speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                        override fun onReadyForSpeech(params: Bundle?) {
                            onStatusChange("Listening, Boss...")
                        }
                        override fun onBeginningOfSpeech() {}
                        override fun onRmsChanged(rmsdB: Float) {}
                        override fun onBufferReceived(buffer: ByteArray?) {}
                        override fun onEndOfSpeech() {
                            onStatusChange("Processing...")
                        }
                        override fun onError(error: Int) {
                            // Retry on common errors instead of giving up
                            when (error) {
                                SpeechRecognizer.ERROR_NO_MATCH,
                                SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                                    onStatusChange("Dobara boliye, Boss...")
                                    speak("Dobara boliye, Boss.")
                                }
                                SpeechRecognizer.ERROR_AUDIO -> {
                                    onStatusChange("Mic error - retry karein")
                                    speak("Mic error, Boss. Retry karein.")
                                }
                                else -> {
                                    onStatusChange("Standing By")
                                }
                            }
                        }
                        override fun onResults(results: Bundle?) {
                            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            if (!matches.isNullOrEmpty()) {
                                val command = matches[0]
                                onStatusChange("Got it!")
                                onSpeechResult(command)
                            } else {
                                onStatusChange("Dobara boliye, Boss...")
                                speak("Samajh nahi aaya, Boss. Dobara boliye.")
                            }
                        }
                        override fun onPartialResults(partialResults: Bundle?) {}
                        override fun onEvent(eventType: Int, params: Bundle?) {}
                    })
                } else {
                    speak("Boss, speech recognition available nahi hai. Google app check karein.")
                }
            }

            fun startListening() {
                try {
                    speechRecognizer?.cancel()
                    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                        putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                        putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                        putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "hi-IN")
                        putExtra(RecognizerIntent.EXTRA_ALSO_INCLUDE_CONFIDENCE_SCORES, true)
                        putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                        putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                        putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 3000L)
                        putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 1500L)
                    }
                    speechRecognizer?.startListening(intent)
                } catch (e: Exception) {
                    speak("Mic start nahi ho pa raha, Boss.")
                    onStatusChange("Standing By")
                }
            }

            fun destroy() {
                tts?.stop()
                tts?.shutdown()
                speechRecognizer?.destroy()
            }
        }
        ENDOFFILE

    - name: Build APK
      run: gradle assembleDebug --stacktrace
      working-directory: ./igris_app

    - name: Upload Igris APK
      uses: actions/upload-artifact@v4
      with:
        name: Igris-AI-App
        path: igris_app/app/build/outputs/apk/debug/*.apk
